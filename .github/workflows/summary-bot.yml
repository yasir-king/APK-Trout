name: APK Trout Automatic Summary Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  summary-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Requirements
        run: pip install -r requirements.txt

      - name: Run Summary Bot
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
        run: python bot.py

      - name: Commit and Push New Public Posts
        run: |
          git config user.name "APK Trout Bot"
          git config user.email "bot@users.noreply.github.com"
          git add posts/ bot_state.json || true
          git diff --cached --quiet || (git commit -m "Auto-post new app summary" && git push)
